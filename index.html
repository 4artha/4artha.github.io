<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="The personal portfolio of C Parthasarathi Reddy, a student at REVA University.">
  <title>C Parthasarathi Reddy — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --paper: #f6f4ef;
      --ink: #242820;
      --muted: #777a70;
      --accent: #526b51;
      --accent-dark: #3d523d;
      --line: #e3e0d7;
      --white: #fffefa;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 82%, rgba(221, 226, 208, .65), transparent 30%),
        radial-gradient(ellipse at 92% 10%, rgba(228, 226, 211, .7), transparent 34%),
        var(--paper);
      font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
    }

    .ambient {
      position: fixed;
      z-index: -1;
      width: 320px;
      height: 320px;
      border: 1px solid rgba(82, 107, 81, .12);
      border-radius: 50%;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .ambient-one {
      top: 16%;
      right: -210px;
      box-shadow:
        0 0 0 24px rgba(82, 107, 81, .025),
        0 0 0 48px rgba(82, 107, 81, .02);
    }

    .ambient-two {
      bottom: 2%;
      left: -250px;
      width: 390px;
      height: 390px;
      animation-delay: -5s;
    }

    main {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 12px;
      flex: 1;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      animation: fade-down .7s ease both;
    }

    .brand {
      display: inline-flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(82, 107, 81, .35);
      border-radius: 50%;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .nav-caption {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: clamp(38px, 8vh, 76px) 0 30px;
      padding: clamp(30px, 7vw, 78px);
      border: 1px solid rgba(227, 224, 215, .95);
      border-radius: 8px;
      background: rgba(255, 254, 250, .76);
      box-shadow: 0 28px 80px rgba(39, 44, 32, .07);
      animation: card-enter .85s cubic-bezier(.2, .7, .25, 1) both;
    }

    .card::before {
      position: absolute;
      z-index: -1;
      top: -165px;
      right: -95px;
      width: 350px;
      height: 350px;
      border: 1px solid rgba(82, 107, 81, .16);
      border-radius: 50%;
      content: "";
      box-shadow:
        0 0 0 22px rgba(82, 107, 81, .035),
        0 0 0 44px rgba(82, 107, 81, .025),
        0 0 0 66px rgba(82, 107, 81, .018);
      animation: slow-turn 35s linear infinite;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      align-items: center;
      gap: clamp(28px, 6vw, 64px);
    }

    .profile-photo {
      display: block;
      width: 190px;
      aspect-ratio: 1;
      border: 5px solid var(--white);
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      box-shadow: 0 12px 34px rgba(39, 44, 32, .16);
      animation: fade-up .8s .3s ease both;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 22px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      animation: fade-up .7s .15s ease both;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #78936f;
      box-shadow: 0 0 0 4px rgba(120, 147, 111, .13);
    }

    h1 {
      max-width: 740px;
      margin: 0;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 8vw, 82px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.02;
      animation: fade-up .8s .25s ease both;
    }

    h1 span {
      color: var(--accent);
    }

    .intro {
      max-width: 480px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      animation: fade-up .8s .35s ease both;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 48px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
      animation: fade-up .8s .45s ease both;
    }

    .detail {
      padding: 16px 18px;
      border: 1px solid rgba(227, 224, 215, .8);
      border-radius: 5px;
      background: rgba(246, 244, 239, .6);
      transition: border-color .25s ease, transform .25s ease, background .25s ease;
    }

    .detail:hover {
      transform: translateY(-3px);
      border-color: rgba(82, 107, 81, .4);
      background: var(--white);
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .value {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
    }

    .social-heading {
      margin: 34px 0 12px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      animation: fade-up .8s .52s ease both;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      animation: fade-up .8s .58s ease both;
    }

    .social-link {
      display: inline-flex;
      min-width: 146px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      background: rgba(255, 254, 250, .7);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition:
        color .25s ease,
        background .25s ease,
        border-color .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    .social-link:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      color: var(--white);
      background: var(--accent);
      box-shadow: 0 9px 22px rgba(58, 78, 55, .15);
    }

    .social-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .social-icon {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .social-arrow {
      color: var(--accent);
      font-size: 17px;
      transition: color .25s ease, transform .25s ease;
    }

    .social-link:hover .social-arrow {
      transform: translate(2px, -2px);
      color: var(--white);
    }

    footer {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 18px 0 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      animation: fade-up .8s .7s ease both;
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-down {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift {
      from { transform: translateY(-10px); }
      to { transform: translateY(18px); }
    }

    @keyframes slow-turn {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      main {
        padding-top: 22px;
      }

      .card {
        margin-top: 38px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .profile-photo {
        grid-row: 1;
        width: min(170px, 55vw);
      }

      .details {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 36px;
      }

      .card::before {
        right: -230px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main>
    <nav aria-label="Main navigation">
      <span class="brand" aria-label="C P R">CPR</span>
      <span class="nav-caption">Personal portfolio</span>
    </nav>

    <section class="card" aria-labelledby="name">
      <div class="hero">
        <div class="hero-copy">
          <p class="topline">
            <span class="status-dot" aria-hidden="true"></span>
            Student · REVA University
          </p>

          <h1 id="name">C Parthasarathi<br><span>Reddy</span></h1>

          <p class="intro">
            A little space on the internet to share who I am and stay connected.
          </p>
        </div>

        <img
          class="profile-photo"
          src="me.jpg"
          alt="C Parthasarathi Reddy sitting on a motorcycle beside a lake"
          width="190"
          height="190"
        >
      </div>

      <div class="details">
        <div class="detail">
          <span class="label">College</span>
          <span class="value">REVA University</span>
        </div>

        <div class="detail">
          <span class="label">Student Registration Number</span>
          <span class="value">R24EQ021</span>
        </div>
      </div>

      <p class="social-heading">Find me online</p>

      <div class="socials" aria-label="Social media links">
        <a
          class="social-link"
          href="https://www.instagram.com/partha.archives/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit my Instagram profile"
        >
          <span class="social-label">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm0 2A3.8 3.8 0 0 0 4 7.8v8.4A3.8 3.8 0 0 0 7.8 20h8.4a3.8 3.8 0 0 0 3.8-3.8V7.8A3.8 3.8 0 0 0 16.2 4H7.8Zm4.2 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/>
            </svg>
            Instagram
          </span>
          <span class="social-arrow" aria-hidden="true">↗</span>
        </a>

        <a
          class="social-link"
          href="https://www.linkedin.com/in/parthasarathi-reddy-41383832b"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit my LinkedIn profile"
        >
          <span class="social-label">
            <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM8.09 18.74H5.12V9.19h2.97v9.55ZM6.61 7.89a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44Zm12.13 10.85h-2.97v-4.65c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46v4.73H9.46V9.19h2.85v1.3h.04c.4-.75 1.37-1.55 2.82-1.55 3.01 0 3.57 1.98 3.57 4.55v5.25Z"/>
            </svg>
            LinkedIn
          </span>
          <span class="social-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> C Parthasarathi Reddy
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
